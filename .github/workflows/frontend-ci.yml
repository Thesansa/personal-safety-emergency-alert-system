name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for frontend changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

      - name: Set up Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://sos-semali-backend.azurewebsites.net/api