name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for frontend changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

      - name: Set up Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm install

      - name: Lint
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://sos-semali-backend.azurewebsites.net/api

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: frontend
        run: |
          docker build --build-arg VITE_API_BASE_URL=https://sos-semali-backend.azurewebsites.net/api \
            -t ghcr.io/thesansa/sos-frontend:latest .
          docker push ghcr.io/thesansa/sos-frontend:latest

      - name: Trigger Azure deployment
        run: curl -X POST "${{ secrets.AZURE_FRONTEND_CD_WEBHOOK }}"