name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for backend changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/sos-backend/**'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        working-directory: backend/sos-backend
        run: |
          cp src/main/resources/application.properties.example src/main/resources/application.properties
          mvn clean package

      - name: Build Docker image
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend/sos-backend
        run: docker build -t nova-sos-backend .

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: backend/sos-backend
        run: |
          docker build -t ghcr.io/thesansa/sos-backend:latest .
          docker push ghcr.io/thesansa/sos-backend:latest

      - name: Trigger Azure deployment
        run: curl -X POST "${{ secrets.AZURE_BACKEND_CD_WEBHOOK }}"