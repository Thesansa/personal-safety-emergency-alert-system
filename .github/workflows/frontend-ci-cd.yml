name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Node and npm versions
        run: |
             node --version
             npm --version
             npm config get registry

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://sos-semali-backend.azurewebsites.net/api

      - name: Build Docker image
        working-directory: frontend
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://sos-semali-backend.azurewebsites.net/api \
            -t nova-sos-frontend .

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: frontend
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://sos-semali-backend.azurewebsites.net/api \
            -t ghcr.io/thesansa/sos-frontend:latest .

          docker push ghcr.io/thesansa/sos-frontend:latest

      - name: Trigger Azure deployment
        run: curl -X POST "${{ secrets.AZURE_FRONTEND_CD_WEBHOOK }}"
