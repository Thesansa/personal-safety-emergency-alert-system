name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/sos-backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/sos-backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: backend/sos-backend
        run: |
          cp src/main/resources/application.properties.example \
             src/main/resources/application.properties
          mvn clean package

      - name: Build Docker image
        working-directory: backend/sos-backend
        run: docker build -t nova-sos-backend .

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: backend/sos-backend
        run: |
          docker build \
            -t ghcr.io/thesansa/sos-backend:latest .

          docker push ghcr.io/thesansa/sos-backend:latest

      - name: Trigger Azure deployment
        run: curl -X POST "${{ secrets.AZURE_BACKEND_CD_WEBHOOK }}"
        